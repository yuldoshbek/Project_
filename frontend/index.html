<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — под вырез и жест-полосу iPhone: без него нижняя панель
         навигации оказывается под жест-полосой, и её кнопки не нажимаются. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Обе темы, а не одна: по этому объявлению браузер красит полосы прокрутки и
         системные части полей ввода. Оставь здесь light — и они останутся светлыми даже
         там, где токены уже переключились. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="ORBITA — что требует внимания сейчас" />
    <!-- Система не для поиска: ссылка на неё личная, и в индексе ей делать нечего. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ORBITA</title>
    <!--
      Тема ставится до первой отрисовки, иначе на приглушённой теме видна светлая вспышка.
      Скрипт встроенный и синхронный намеренно: внешний файл загрузился бы после разбора
      разметки, и вспышка вернулась бы.

      Состояние «как в системе» не снимает атрибут, а подставляет вычисленное значение —
      поэтому в CSS хватает одного блока на приглушённую тему вместо двух (медиа-запрос и
      атрибут), которые разошлись бы на первой правке.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('orbita.theme');
          if (saved === 'light' || saved === 'dim') {
            theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dim';
          }
        } catch (error) {
          // Хранилище недоступно — приватное окно, запрет на данные сайта. Остаётся
          // светлая тема: это рабочее состояние, а не отказ.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!--
      Первые запросы — до загрузки кода. «Кто вошёл» нужен на любом экране, данные Пульта —
      на главном. Пока телефон по 4G тянет основной кусок сборки, ответы уже приходят, и
      приложение берёт их из предзагрузки: режим и учётные данные совпадают с `fetch`
      клиента (`same-origin`, shared/api/client.ts). Замер первого экрана (критерий 4
      блока 3): запросы стартовали только через ~1,7 с, после исполнения кода.
    -->
    <script>
      (function () {
        var paths = ['/api/me'];
        if (window.location.pathname === '/') paths.push('/api/v1/pult');
        paths.forEach(function (path) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = path;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
