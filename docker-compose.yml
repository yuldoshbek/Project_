# Локальное окружение разработки: одна PostgreSQL и ничего больше.
#
# Раньше здесь жили Redis, MinIO, антивирус, преобразователь документов и перехватчик
# почты — пять контейнеров и гигабайты образов. Все они сняты вместе с прежним стеком
# (ADR-0032, CLAUDE.md, раздел «Чего не делать»): фон работает задачами по расписанию,
# файлы уходят в хранилище через порт, уведомления приходят пушем.
#
# Рабочий контур этим файлом не описывается: он собирается из облачных площадок
# (ADR-0028). Сборка для сервера агентства появится в блоке 3.
#
# Порт на хосте смещён (55433) и привязан к 127.0.0.1. Две причины, обе из практики.
#
# Первая: 55432 на машине разработчика занимает база ассистента SETA. Совпадение портов
# означает, что тесты ORBITA накатывают схему в чужую базу, и узнаётся это не по отказу, а
# по её содержимому.
#
# Вторая: если оставить порт 5432 и на машине уже работает PostgreSQL, он занимает
# IPv4:5432, контейнер садится только на IPv6, и клиент молча уходит в чужую базу —
# соединение рвётся без единой записи в логах контейнера. Привязка к 127.0.0.1 заодно не
# выставляет базу разработки в локальную сеть.

name: orbita

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORBITA_DB_USER:-orbita}
      POSTGRES_PASSWORD: ${ORBITA_DB_PASSWORD:-orbita}
      POSTGRES_DB: ${ORBITA_DB_NAME:-orbita}
      # Тестовая база создаётся рядом с рабочей: тесты не должны затирать данные разработки
      ORBITA_TEST_DB: ${ORBITA_TEST_DB:-orbita_test}
      # Локаль влияет на сортировку — для узбекской латиницы это существенно
      LANG: C.UTF-8
    ports:
      - '127.0.0.1:${ORBITA_DB_PORT:-55433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ORBITA_DB_USER:-orbita} -d ${ORBITA_DB_NAME:-orbita}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
