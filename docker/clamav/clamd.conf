# Настройки демона clamd для локального окружения ORBITA.
#
# Файл подменяет тот, что лежит в образе. Причина одна и существенная: у clamd предел
# потоковой проверки по умолчанию — 25 МБ, а вложение у нас принимается до 50 МБ
# (OPEN-QUESTIONS Q7). С настройками образа файл на 30 МБ не был бы признан заражённым —
# он не был бы проверен вовсе, и приложение получило бы отказ вместо приговора.

LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav

# Пределы под наш предел вложения, с запасом: архив распаковывается при проверке, и
# MaxScanSize считает суммарный объём распакованного, а не размер файла.
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 400M

# Пользователей двое; больше четырёх одновременных проверок здесь не бывает.
MaxThreads 4
