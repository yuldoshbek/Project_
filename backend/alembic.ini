# Alembic configuration.
#
# NOTE: this file must stay ASCII-only. configparser reads it in the OS default
# encoding (cp1251 on a Russian Windows), so Cyrillic comments break `alembic` on
# some machines. This is the one file in the project where comments are in English;
# the explanations live in alembic/env.py, which is read as UTF-8.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# No sqlalchemy.url here on purpose: it is built from settings in env.py.
# The repository is public and a password has no place in a tracked file.

# Date keeps revisions ordered in a directory listing. No %%(slug)s on purpose:
# revision messages are in Russian, and Cyrillic file names break in archives,
# container images and on hosts with a non-UTF-8 locale. The Russian description
# lives in the revision docstring instead.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s

[post_write_hooks]
# A generated revision goes through the same formatter as the rest of the code,
# otherwise the next `make check` fails on autogenerated output.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
