[project]
name = "orbita-backend"
version = "0.1.0"
description = "ORBITA — система управления проектами и задачами Агентства «Ўзбеккосмос»"
requires-python = ">=3.12"

# Зависимости добавляет тот тикет, которому они нужны, а не «на будущее».
# Здесь — только то, без чего не собирается каркас (ORB-003, ORB-004).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "redis>=5.2",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# ruff — форматирование и линт
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async-специфичные ошибки
    "S",         # bandit: небезопасные конструкции
    "DTZ",       # даты без часового пояса — прямой запрет из CLAUDE.md
    "RUF",
]
ignore = [
    "S101",   # assert в тестах — норма
    # Комментарии и docstring в проекте — на русском (CLAUDE.md, раздел «Язык»).
    # Правила про «неоднозначные» кириллические символы дают сплошной шум.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # пароли-заглушки в тестах

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------
# mypy — строгий на домене, умеренный на остальном
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# redis-py поставляет py.typed, но часть его публичных функций (from_url) не
# аннотирована. Требовать этого от тестов бессмысленно — в коде приложения проверка
# остаётся включённой.
disallow_untyped_calls = false

# Библиотеки без маркера py.typed: аннотации внутри есть, но mypy их не видит.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "infra: тест требует поднятого окружения — make up (PostgreSQL, Redis)",
    "db: тест работает с базой данных",
    "slow: длительный тест, не входит в быстрый прогон",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --------------------------------------------------------------------------
# import-linter — границы слоёв из CLAUDE.md.
# Правило: api → services → domain; services → repos/adapters через порты.
# Обратные импорты запрещены.
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои приложения"
type = "layers"
layers = [
    "app.api",
    "app.workers",
    "app.services",
    "app.repos | app.adapters",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Домен не знает про фреймворки и БД"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "starlette", "asyncpg", "redis", "arq"]
