# Задачи по расписанию: утренняя сводка, снимок дня, проверка сроков.
#
# Расписание держит GitHub, а не площадка размещения (ADR-0035). Выполняет задачу всегда
# само приложение — обработчик за защищённым эндпоинтом. Здесь только будильник, поэтому
# переезд на сервер агентства меняет строку cron, а не код.
#
# Задачи обязаны быть идемпотентными: GitHub может пропустить запуск или позвать дважды,
# и второй вызов не должен отправить второе уведомление (CLAUDE.md, инвариант 10).
# Пропущенный запуск не догоняется: сутки без снимка остаются без записи, и это видно по
# списку прогонов (docstring daily_snapshot в backend/app/jobs/handlers.py).

name: Задачи по расписанию

on:
  schedule:
    # Ташкент — UTC+5 круглый год, перехода на летнее время нет.
    #
    # Сводку расписание спрашивает каждые десять минут с 06:00 до 11:50, а не зовёт в
    # 08:30: время сводки — порог, его меняет помощник в «Управлении» без выкладки (V24), а
    # строку cron меняет только выкладка. День занимает только доставленная сводка: после
    # неё задача отвечает «уже сделано» одним запросом к базе. До того — not_due с
    # причиной и без строки о прогоне: «ещё не время», «у руководителя не включены
    # уведомления», «нет ключа»; руководитель, включивший уведомления в 09:00, получит
    # сводку в 09:10. Служба уведомлений не приняла сводку — ответ 503, прогон красный, а
    # следующий вызов пробует снова. Шаг 10 минут — на столько сводка может опоздать сверх
    # задержки GitHub; чаще 5 минут GitHub не зовёт. Порог принимает время с 06:00 до 11:00
    # (backend/app/domain/push.py, SUMMARY_WINDOW): после назначенного времени остаётся не
    # меньше шести вызовов на случай пропуска или отказа. Последний вызов, 11:50, — это
    # LAST_SUMMARY_RUN там же; совпадение с этой строкой проверяет backend/tests/test_jobs.py.
    - cron: '*/10 1-6 * * *' # 06:00–11:50 — утренняя сводка руководителю, когда пора
    - cron: '50 18 * * *' # 23:50 — снимок состояния за день
    # Каждый час в рабочее время, а не круглосуточно: просрочка считается по
    # календарным дням, и за ночь её результат измениться не может. 456 лишних
    # пробуждений базы в месяц — это деньги за вычислитель и ноль пользы.
    - cron: '0 4-14 * * 1-6' # 09:00–19:00 Ташкент, кроме воскресенья — сроки
  workflow_dispatch:
    inputs:
      job:
        description: 'Какую задачу выполнить сейчас'
        type: choice
        default: deadline-check
        options:
          - morning-summary
          - daily-snapshot
          - deadline-check

concurrency:
  group: jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Выполнить задачу
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Позвать обработчик
        env:
          API_ORIGIN: ${{ secrets.PRODUCTION_API_ORIGIN }}
          JOBS_SECRET: ${{ secrets.PRODUCTION_JOBS_SECRET }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
        run: |
          if [ -z "$API_ORIGIN" ] || [ -z "$JOBS_SECRET" ]; then
            {
              echo "### Расписание выключено"
              echo "Нет секретов PRODUCTION_API_ORIGIN или PRODUCTION_JOBS_SECRET."
              echo "Порядок — docs/SETUP.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Строки case обязаны совпадать со строками cron выше символ в символ: GitHub
          # передаёт в github.event.schedule ровно строку расписания. Совпадение держит
          # тест backend/tests/test_jobs.py — прежде ежечасная строка разошлась с case,
          # и проверка сроков молча не запускалась ни разу.
          # Ручной запуск сводки до её времени или без устройства руководителя ответит
          # not_due с причиной: проверку «пора» снимает только --force командной строки, в
          # расписании его нет.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            job="$MANUAL_JOB"
          else
            case "$SCHEDULE" in
              '*/10 1-6 * * *') job=morning-summary ;;
              '50 18 * * *') job=daily-snapshot ;;
              '0 4-14 * * 1-6') job=deadline-check ;;
              *)
                echo "::error::Расписание «$SCHEDULE» не сопоставлено задаче — поправьте case рядом с cron"
                exit 1
                ;;
            esac
          fi
          if [ -z "$job" ]; then
            echo "::error::Имя задачи пусто"
            exit 1
          fi
          echo "задача: $job"

          # Три попытки: функция может подниматься из холодного состояния дольше, чем
          # ждёт curl, и один отказ сети не должен означать пропущенную сводку.
          # pipefail и код curl, а не tee: без них 503 неудачного прогона, 401 от неверного
          # секрета и обрыв сети давали зелёный прогон и ни одного письма. Код запоминается,
          # а не роняет шаг сразу: строка в сводке прогона нужна и при неудаче — именно
          # тогда её и читают.
          set -o pipefail
          status=0
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            --request POST "$API_ORIGIN/internal/jobs/$job" \
            --header "X-Orbita-Jobs-Secret: $JOBS_SECRET" \
            --header 'Content-Type: application/json' \
            --data '{"source":"github-actions"}' | tee response.json || status=$?
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Исход и его причина (done · sent, not_due · no_device, failed · refused) — ответ
          # на «почему не пришла» прямо в сводке прогона, без поиска по логам функции. Тело
          # не JSON (обрыв сети, отказ прокси) — «без ответа», а не упавший jq.
          outcome="$(jq -r '[.status, .result.reason] | map(select(. != null)) | join(" · ")' response.json 2>/dev/null || true)"
          echo "Задача \`$job\`: ${outcome:-без ответа}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "Запрос к обработчику не удался, код curl $status — подробности в журнале шага." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
