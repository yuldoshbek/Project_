# Проверки, без которых ничего не сливается в main.
#
# Пять независимых работ: документы, backend, миграции, frontend, сценарии со снимками.
# Разделены нарочно — красный frontend не должен скрывать, что backend тоже красный: на
# приёмке блока нужно видеть весь список поломок сразу, а не по одной за прогон.
#
# Тесты идут против настоящей PostgreSQL 16. Подменять базу заглушкой — значит проверять
# заглушку: половина наших правил живёт в ограничениях схемы и в NULLS NOT DISTINCT.
#
# Ветки блоков проверяются на каждый push, а не только в PR: блок живёт в своей ветке
# неделями, и «зелёный» должен значить зелёный на GitHub, а не на машине разработчика.
# До 25.09.2026 проверки на ветках блоков не запускались ни разу.

name: Проверки

on:
  push:
    branches: [main, 'block-*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  docs:
    name: Документы
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ключевые документы на месте, ссылки целы
        run: python scripts/check_docs.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
          POSTGRES_DB: orbita
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      ORBITA_ENV: test
      # Значение-заглушка: настоящие ключи живут в секретах развёртывания и в окружении
      # Vercel. В репозитории ключей нет — он публичный.
      ORBITA_SESSION_SECRET: ci-session-secret-not-for-production-32-chars-min
      ORBITA_JOBS_SECRET: ci-jobs-secret-not-for-production
      ORBITA_DATABASE_URL: postgresql+asyncpg://orbita:orbita@localhost:5432/orbita
      # Части адреса — отдельно: тесты и миграции тестовой базы собирают адрес из них, а не
      # из строки выше (она указывает на базу разработки). Без них берётся порт по
      # умолчанию для машины разработчика, и в CI не находится ни одна база.
      ORBITA_DB_HOST: localhost
      ORBITA_DB_PORT: '5432'
      ORBITA_DB_USER: orbita
      ORBITA_DB_PASSWORD: orbita
      ORBITA_TEST_DB: orbita_test
      ORBITA_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Установить Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Зависимости
        run: uv sync --all-groups --frozen

      # requirements.txt — это то, что поставит Vercel в функцию. Единственный источник
      # правды — uv.lock; расхождение означает, что в облаке окажется не то, что проверено
      # здесь. Пересобрать: make reqs.
      - name: Список зависимостей для Vercel не отстал
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

      - name: ruff — линт
        run: uv run ruff check --output-format=github .

      - name: ruff — форматирование
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app tests

      - name: Границы слоёв
        run: uv run lint-imports

      # Тестовую базу на машине разработчика создаёт init-скрипт контейнера
      # (docker/postgres/init), а сервис-контейнер CI заводит только POSTGRES_DB. Без этого
      # шага все тесты падают на подготовке: «database orbita_test does not exist».
      - name: Тестовая база
        env:
          PGPASSWORD: orbita
        run: psql -h localhost -U orbita -d orbita -c "CREATE DATABASE orbita_test"

      - name: Тесты
        run: uv run pytest

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
          POSTGRES_DB: orbita
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      ORBITA_ENV: test
      ORBITA_SESSION_SECRET: ci-session-secret-not-for-production-32-chars-min
      ORBITA_JOBS_SECRET: ci-jobs-secret-not-for-production
      ORBITA_DATABASE_URL: postgresql+asyncpg://orbita:orbita@localhost:5432/orbita

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --frozen

      # Две головы означают, что две ветки независимо добавили миграции и порядок применения
      # неопределён: на рабочей базе это ловится уже после выкладки.
      - name: Голова одна
        run: |
          heads=$(uv run alembic heads | grep -c . || true)
          echo "голов: $heads"
          test "$heads" -eq 1

      - name: Применить на чистую базу
        run: uv run alembic upgrade head

      # Схема в базе должна совпадать с моделями: расхождение значит, что кто-то правил
      # модель и забыл миграцию, и первое падение случится на настоящих данных.
      - name: Схема совпадает с моделями
        run: uv run alembic check

      - name: Откат и повторное применение
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: Цветовые литералы только в токенах
        run: npm run lint:css

      - name: Типы
        run: npm run typecheck

      - name: Форматирование
        run: npm run fmt:check

      - name: Тесты
        run: npm run test

      # Сборка — тоже проверка: половина ошибок конфигурации Vite и Tailwind видна
      # только здесь, а не в dev-режиме.
      - name: Сборка
        run: npm run build

  e2e:
    name: Сценарии и снимки
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Сценарии идут по собранной сборке и настоящему API на настоящей PostgreSQL. Иначе
    # проверялось бы то, чего в облаке нет: режим разработки, заглушка вместо базы и вход,
    # подменённый ради удобства теста.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
          POSTGRES_DB: orbita
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      ORBITA_ENV: test
      ORBITA_SESSION_SECRET: ci-session-secret-not-for-production-32-chars-min
      ORBITA_JOBS_SECRET: ci-jobs-secret-not-for-production
      ORBITA_DATABASE_URL: postgresql+asyncpg://orbita:orbita@localhost:5432/orbita
      ORBITA_BASE_URL: http://localhost:4173
      ORBITA_E2E_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Схема и справочники
        working-directory: backend
        run: |
          uv sync --all-groups --frozen
          uv run alembic upgrade head
          uv run python -m app.seed
          # Вымышленные данные: без них Пульт пуст, и проверка «пять строк без прокрутки»
          # проверяла бы пустой экран.
          uv run python -m app.demo

      - name: Поднять API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --port 8000 --log-level warning &
          # Ждём готовности, а не спим наугад: «sleep 5» либо тратит время, либо не
          # хватает — и тогда падают сценарии, а не запуск.
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/api/health

      - name: Собрать и поднять интерфейс
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173 > /dev/null && break
            sleep 1
          done

      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      # Снимки трёх устройств в двух темах — часть отчёта блока. При падении к ним
      # добавляется трасса: по ней видно, что происходило, без повторения прогона руками.
      - name: Снимки и трассы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            docs/reports/block-1/*.png
            docs/reports/block-1/*.pdf
            frontend/test-results/**
          retention-days: 14
