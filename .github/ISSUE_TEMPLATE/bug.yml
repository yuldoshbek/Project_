name: Дефект
description: Система ведёт себя не так, как написано в ТЗ
labels: ['дефект']
body:
  - type: markdown
    attributes:
      value: |
        Расхождение с [ТЗ v2.0](https://github.com/yuldoshbek/Project_/blob/main/tz/TZ-ORBITA-v2.0.md) —
        это дефект. Неясность в требованиях — не дефект, она идёт в открытые вопросы.

  - type: textarea
    id: expected
    attributes:
      label: Что должно происходить
      description: Со ссылкой на пункт ТЗ, инвариант из CLAUDE.md или решение ADR
      placeholder: 'По ТЗ 4 «просрочено» — вычисляемое состояние, а не статус…'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что происходит на самом деле
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Где видно
      options:
        - iPhone
        - Ноутбук
        - Большой монитор
        - Во всех
    validations:
      required: true

  - type: dropdown
    id: contour
    attributes:
      label: Контур
      options:
        - Рабочая система
        - Превью PR
        - Разработка на машине
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Данные
      description: |
        Реальные поручения, фамилии и содержание писем сюда не вставляются — репозиторий
        публичный. Достаточно номера и вида записи: «поручение 24/1-1234, срок 25.12».
